<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETEs existentes – Mapa satélite</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --ink: #0f2a33;
    --ink-2: #1a3d49;
    --paper: #f4f7f6;
    --line: #d3dedb;
    --muted: #61797f;
    --ok: #1c9c69;
    --off: #d3423f;
    --water: #2b7fa6;
    --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: var(--font); color: var(--ink); }
  #map { position: absolute; inset: 0; background: #0b1c22; }

  /* ---------- Painel ---------- */
  .panel {
    position: absolute; z-index: 1000; top: 12px; left: 12px;
    width: 320px; max-height: calc(100% - 24px);
    display: flex; flex-direction: column;
    background: var(--paper); border-radius: 10px;
    box-shadow: 0 6px 24px rgba(5, 20, 26, .38);
    overflow: hidden;
  }
  .panel-head {
    background: var(--ink); color: #fff; padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .panel-head h1 { font-size: 16px; font-weight: 650; margin: 0; letter-spacing: .1px; }
  .panel-head p { margin: 2px 0 0; font-size: 12px; color: #a9c3cb; }
  .toggle {
    appearance: none; border: 1px solid #3b6572; background: transparent; color: #dcebef;
    font: inherit; font-size: 12px; padding: 5px 9px; border-radius: 6px; cursor: pointer; white-space: nowrap;
  }
  .toggle:hover { background: var(--ink-2); }

  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin: 12px 12px 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
  .seg button {
    appearance: none; border: 0; background: transparent; font: inherit; color: var(--ink);
    padding: 8px 4px 7px; cursor: pointer; text-align: center; line-height: 1.2;
    border-right: 1px solid var(--line);
  }
  .seg button:last-child { border-right: 0; }
  .seg button b { display: block; font-size: 17px; font-weight: 650; }
  .seg button span { font-size: 11.5px; color: var(--muted); }
  .seg button:hover { background: #eef4f2; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .seg button[aria-pressed="true"] span { color: #b9d2d9; }
  .seg button[data-f="Operante"] b { color: var(--ok); }
  .seg button[data-f="Inoperante"] b { color: var(--off); }
  .seg button[aria-pressed="true"] b { color: #fff; }

  .search { margin: 10px 12px 0; }
  .search input {
    width: 100%; font: inherit; font-size: 13.5px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
  }
  .search input::placeholder { color: #8ba0a5; }

  .list { list-style: none; margin: 10px 0 0; padding: 0 0 6px; overflow-y: auto; flex: 1 1 auto; min-height: 0; max-height: 46vh; border-top: 1px solid var(--line); }
  .list li { margin: 0; }
  .list button {
    appearance: none; width: 100%; border: 0; background: transparent; font: inherit; text-align: left; cursor: pointer;
    display: flex; align-items: center; gap: 10px; padding: 8px 14px; color: var(--ink); font-size: 13.5px;
    border-bottom: 1px solid #e6eeec;
  }
  .list button:hover { background: #e9f1ef; }
  .list .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .list .dot.Operante { background: var(--ok); }
  .list .dot.Inoperante { background: var(--off); }
  .list .empty { padding: 16px 14px; color: var(--muted); font-size: 13px; }
  .panel.collapsed .seg ~ *, .panel.collapsed .seg { display: none; }

  :focus-visible { outline: 2px solid var(--water); outline-offset: 2px; }
  .panel-head :focus-visible { outline-color: #8fd0ea; }

  /* ---------- Marcadores ---------- */
  .pin { background: none; border: 0; }
  .pin svg { display: block; filter: drop-shadow(0 1px 3px rgba(0,0,0,.6)); transition: transform .12s; }
  .pin:hover svg, .pin.active svg { transform: scale(1.25); }

  /* ---------- Popup (tabela de atributos) ---------- */
  .leaflet-popup-content-wrapper { border-radius: 10px; padding: 0; overflow: hidden; }
  .leaflet-popup-content { margin: 0; font-family: var(--font); }
  .pop-head { background: var(--ink); color: #fff; padding: 10px 34px 10px 14px; font-size: 14px; font-weight: 650; }
  .rec { padding: 10px 12px 12px; }
  .rec + .rec { border-top: 3px solid var(--ink); }
  .rec-title { font-size: 12px; color: var(--muted); margin: 0 0 6px 2px; }
  table.attr { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.attr th, table.attr td { text-align: left; padding: 6px 8px; border: 1px solid var(--line); vertical-align: top; }
  table.attr th { width: 38%; background: #edf3f1; font-weight: 600; color: #35555e; }
  table.attr td { background: #fff; }
  table.attr td.null { color: #93a5a9; font-style: italic; }
  table.attr tr.calc th { font-weight: 500; color: var(--muted); }
  .status { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
  .status i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .status.Operante { color: #12784f; } .status.Operante i { background: var(--ok); }
  .status.Inoperante { color: #b02f2c; } .status.Inoperante i { background: var(--off); }
  .sv {
    display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px;
    background: var(--water); color: #fff !important; text-decoration: none; font-weight: 600; font-size: 13.5px;
    padding: 9px 12px; border-radius: 8px;
  }
  .sv:hover { background: #226a8b; }
  .leaflet-container a.sv { color: #fff; }

  .leaflet-tooltip.tip { font-family: var(--font); font-weight: 600; font-size: 12.5px; color: var(--ink); border: 0; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.35); }

  @media (max-width: 700px) {
    .panel { width: calc(100% - 24px); }
    .list { max-height: 30vh; }
    .leaflet-control-layers { margin-top: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .pin svg { transition: none; } }
</style>
</head>
<body>
<div id="map"></div>

<section class="panel" id="panel" aria-label="Filtro e lista de ETEs">
  <div class="panel-head">
    <div>
      <h1>ETEs existentes</h1>
      <p id="count-line"></p>
    </div>
    <button class="toggle" id="toggle" type="button" aria-expanded="true">Ocultar filtros</button>
  </div>
  <div class="seg" role="group" aria-label="Filtrar por situação">
    <button type="button" data-f="all" aria-pressed="true"><b id="n-all">0</b><span>Todas</span></button>
    <button type="button" data-f="Operante" aria-pressed="false"><b id="n-op">0</b><span>Operantes</span></button>
    <button type="button" data-f="Inoperante" aria-pressed="false"><b id="n-in">0</b><span>Inoperantes</span></button>
  </div>
  <div class="search"><input id="q" type="search" placeholder="Buscar ETE pelo nome" autocomplete="off" aria-label="Buscar ETE pelo nome"></div>
  <ul class="list" id="list"></ul>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const DATA = {"type": "FeatureCollection", "features": [{"type": "Feature", "properties": {"fid": null, "NOME": "ETE ORQUÍDEA", "SITUACAO": "Inoperante"}, "geometry": {"type": "Point", "coordinates": [-43.4154824, -22.7309826]}}, {"type": "Feature", "properties": {"fid": null, "NOME": "ETE JOINVILLE", "SITUACAO": "Inoperante"}, "geometry": {"type": "Point", "coordinates": [-43.3477687, -22.7134306]}}, {"type": "Feature", "properties": {"fid": null, "NOME": "ETE PANORAMA", "SITUACAO": "Inoperante"}, "geometry": {"type": "Point", "coordinates": [-43.4240017, -22.7120413]}}, {"type": "Feature", "properties": {"fid": null, "NOME": "ETE SARAPUÍ", "SITUACAO": "Operante"}, "geometry": {"type": "Point", "coordinates": [-43.3465595, -22.755506]}}, {"type": "Feature", "properties": {"fid": null, "NOME": "ETE RODOLFO GONÇALVES", "SITUACAO": "Operante"}, "geometry": {"type": "Point", "coordinates": [-42.3713994, -22.0341854]}}, {"type": "Feature", "properties": {"fid": null, "NOME": "ETE FIGUEIRA", "SITUACAO": "Operante"}, "geometry": {"type": "Point", "coordinates": [-43.3072659, -22.678607]}}, {"type": "Feature", "properties": {"fid": null, "NOME": "ETE JARDIM GRAMACHO", "SITUACAO": "Operante"}, "geometry": {"type": "Point", "coordinates": [-43.2832504, -22.7488017]}}, {"type": "Feature", "properties": {"fid": null, "NOME": "ETE CABUÇU", "SITUACAO": "Operante"}, "geometry": {"type": "Point", "coordinates": [-42.8983639, -22.8193019]}}, {"type": "Feature", "properties": {"fid": null, "NOME": "ETE SÃO JOSÉ", "SITUACAO": "Operante"}, "geometry": {"type": "Point", "coordinates": [-42.8863327, -22.8405997]}}, {"type": "Feature", "properties": {"fid": null, "NOME": "ETE CURUZU", "SITUACAO": "Operante"}, "geometry": {"type": "Point", "coordinates": [-42.8568506, -22.8378408]}}, {"type": "Feature", "properties": {"fid": null, "NOME": "ETE GRANDE RIO", "SITUACAO": "Operante"}, "geometry": {"type": "Point", "coordinates": [-42.9477743, -22.7250726]}}, {"type": "Feature", "properties": {"fid": null, "NOME": "ETE APOLLO", "SITUACAO": "Operante"}, "geometry": {"type": "Point", "coordinates": [-42.9428057, -22.7805095]}}, {"type": "Feature", "properties": {"fid": null, "NOME": "ETE LAGOA", "SITUACAO": "Inoperante"}, "geometry": {"type": "Point", "coordinates": [-43.0456052, -22.646023]}}, {"type": "Feature", "properties": {"fid": null, "NOME": "ETE MAUA", "SITUACAO": "Inoperante"}, "geometry": {"type": "Point", "coordinates": [-43.1579821, -22.7076052]}}, {"type": "Feature", "properties": {"fid": null, "NOME": "ETE SARAPUÍ", "SITUACAO": "Operante"}, "geometry": {"type": "Point", "coordinates": [-43.3465595, -22.755506]}}, {"type": "Feature", "properties": {"fid": null, "NOME": "ETE MIRACEMA", "SITUACAO": "Operante"}, "geometry": {"type": "Point", "coordinates": [-42.2090218, -21.4362027]}}, {"type": "Feature", "properties": {"fid": null, "NOME": "ETE SÃO JORGE", "SITUACAO": "Operante"}, "geometry": {"type": "Point", "coordinates": [-43.5594272, -22.6908579]}}, {"type": "Feature", "properties": {"fid": null, "NOME": "ETE QUEIMADOS", "SITUACAO": "Inoperante"}, "geometry": {"type": "Point", "coordinates": [-43.634297, -22.7267494]}}, {"type": "Feature", "properties": {"fid": null, "NOME": "ETE JARDIM CATARINA", "SITUACAO": "Operante"}, "geometry": {"type": "Point", "coordinates": [-43.0086554, -22.796487]}}, {"type": "Feature", "properties": {"fid": null, "NOME": "ETE SÃO GONÇALO", "SITUACAO": "Operante"}, "geometry": {"type": "Point", "coordinates": [-43.0621595, -22.8027835]}}, {"type": "Feature", "properties": {"fid": null, "NOME": "ETE PINHÃO", "SITUACAO": "Operante"}, "geometry": {"type": "Point", "coordinates": [-42.7294537, -22.7359157]}}, {"type": "Feature", "properties": {"fid": null, "NOME": "ETE LAGOINHA", "SITUACAO": "Operante"}, "geometry": {"type": "Point", "coordinates": [-43.5892758, -22.7984203]}}, {"type": "Feature", "properties": {"fid": null, "NOME": "FOSSA PARAIBA", "SITUACAO": "Operante"}, "geometry": {"type": "Point", "coordinates": [-42.3794447, -21.7532938]}}, {"type": "Feature", "properties": {"fid": null, "NOME": "ETE APERIBÉ", "SITUACAO": "Operante"}, "geometry": {"type": "Point", "coordinates": [-42.0970288, -21.6254987]}}, {"type": "Feature", "properties": {"fid": null, "NOME": "ETE PAVUNA", "SITUACAO": "Operante"}, "geometry": {"type": "Point", "coordinates": [-43.3070969, -22.8022857]}}, {"type": "Feature", "properties": {"fid": null, "NOME": "ETE PENHA", "SITUACAO": "Operante"}, "geometry": {"type": "Point", "coordinates": [-43.2685468, -22.8328644]}}, {"type": "Feature", "properties": {"fid": null, "NOME": "ETE ILHA DO GOVERNADOR", "SITUACAO": "Operante"}, "geometry": {"type": "Point", "coordinates": [-43.1874038, -22.795857]}}, {"type": "Feature", "properties": {"fid": null, "NOME": "ETE ALEGRIA", "SITUACAO": "Operante"}, "geometry": {"type": "Point", "coordinates": [-43.2273667, -22.8730932]}}]};

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n.toLocaleString('pt-BR', {minimumFractionDigits: 6, maximumFractionDigits: 6});
const COLOR = { Operante: '#1c9c69', Inoperante: '#d3423f' };

const feats = DATA.features.map((f, i) => ({
  i,
  nome: f.properties.NOME,
  situacao: f.properties.SITUACAO,
  fid: f.properties.fid,
  lon: f.geometry.coordinates[0],
  lat: f.geometry.coordinates[1]
}));

/* ---------- Mapa ---------- */
const map = L.map('map', { zoomControl: false, maxZoom: 20 });
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(map);

const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxNativeZoom: 19, maxZoom: 20,
  attribution: 'Imagens: Esri, Maxar, Earthstar Geographics e a comunidade GIS'
}).addTo(map);
const ruas = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxNativeZoom: 19, maxZoom: 20, attribution: '&copy; OpenStreetMap'
});
const rotulos = L.layerGroup([
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { maxNativeZoom: 19, maxZoom: 20 }),
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxNativeZoom: 19, maxZoom: 20 })
]);
L.control.layers({ 'Satélite': sat, 'Mapa de ruas': ruas }, { 'Nomes de ruas e locais': rotulos }, { position: 'topright' }).addTo(map);

/* ---------- Marcadores ---------- */
const layer = L.layerGroup().addTo(map);
let markers = {};      // feat.i -> marker
let activeMarker = null;

function pinIcon(status) {
  const c = COLOR[status] || '#888';
  const glyph = status === 'Operante'
    ? '<path d="M8.2 14.2l3.3 3.3 6.3-6.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>'
    : '<path d="M9 9l10 10M19 9L9 19" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>';
  return L.divIcon({
    className: 'pin',
    html: `<svg width="30" height="30" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" fill="${c}" stroke="#fff" stroke-width="2.4"/>${glyph}</svg>`,
    iconSize: [30, 30], iconAnchor: [15, 15], popupAnchor: [0, -14], tooltipAnchor: [0, -14]
  });
}

function recordHtml(f, n, total) {
  const svUrl = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${f.lat},${f.lon}`;
  const fidCell = f.fid == null ? '<td class="null">NULL</td>' : `<td>${esc(f.fid)}</td>`;
  return `<div class="rec">
    ${total > 1 ? `<p class="rec-title">Registro ${n} de ${total} neste local</p>` : ''}
    <table class="attr">
      <tr><th>fid</th>${fidCell}</tr>
      <tr><th>NOME</th><td>${esc(f.nome)}</td></tr>
      <tr><th>SITUACAO</th><td><span class="status ${esc(f.situacao)}"><i></i>${esc(f.situacao)}</span></td></tr>
      <tr class="calc"><th>Latitude</th><td>${fmt(f.lat)}</td></tr>
      <tr class="calc"><th>Longitude</th><td>${fmt(f.lon)}</td></tr>
    </table>
    <a class="sv" href="${svUrl}" target="_blank" rel="noopener">Abrir no Street View</a>
  </div>`;
}

function popupHtml(group) {
  const title = group.length > 1 ? [...new Set(group.map(g => g.nome))].join(' / ') : group[0].nome;
  return `<div class="pop-head">${esc(title)}</div>` + group.map((f, k) => recordHtml(f, k + 1, group.length)).join('');
}

/* ---------- Estado / filtros ---------- */
let filtro = 'all';
let busca = '';
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

const visible = () => feats.filter(f =>
  (filtro === 'all' || f.situacao === filtro) && (!busca || norm(f.nome).includes(norm(busca)))
);

function render(fit) {
  layer.clearLayers();
  markers = {};
  activeMarker = null;
  const vis = visible();

  // agrupa registros que estão exatamente no mesmo ponto
  const groups = new Map();
  vis.forEach(f => {
    const k = f.lat + ',' + f.lon;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(f);
  });
  groups.forEach(group => {
    const f = group[0];
    const status = group.every(g => g.situacao === f.situacao) ? f.situacao : 'Operante';
    const m = L.marker([f.lat, f.lon], { icon: pinIcon(status), keyboard: true, title: group.map(g => g.nome).join(' / ') })
      .bindTooltip(esc(group[0].nome), { direction: 'top', className: 'tip' })
      .bindPopup(popupHtml(group), { minWidth: 270, maxWidth: 340, autoPanPaddingTopLeft: window.innerWidth > 700 ? [350, 20] : [20, 20] });
    m.on('popupopen', () => { activeMarker = m; m.getElement()?.classList.add('active'); });
    m.on('popupclose', () => { m.getElement()?.classList.remove('active'); });
    m.addTo(layer);
    group.forEach(g => markers[g.i] = m);
  });

  // contadores (dependem só do texto de busca, não do filtro)
  const base = feats.filter(f => !busca || norm(f.nome).includes(norm(busca)));
  document.getElementById('n-all').textContent = base.length;
  document.getElementById('n-op').textContent = base.filter(f => f.situacao === 'Operante').length;
  document.getElementById('n-in').textContent = base.filter(f => f.situacao === 'Inoperante').length;
  document.getElementById('count-line').textContent =
    vis.length === feats.length ? `${feats.length} registros no mapa` : `${vis.length} de ${feats.length} registros no mapa`;

  // lista
  const ul = document.getElementById('list');
  ul.innerHTML = vis.length
    ? vis.slice().sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')).map(f =>
        `<li><button type="button" data-i="${f.i}"><span class="dot ${esc(f.situacao)}"></span>${esc(f.nome)}</button></li>`).join('')
    : '<li class="empty">Nenhuma ETE encontrada com esses filtros.</li>';

  if (fit && vis.length) {
    const b = L.latLngBounds(vis.map(f => [f.lat, f.lon]));
    const wide = window.innerWidth > 700;
    map.fitBounds(b, {
      paddingTopLeft: wide ? [350, 40] : [30, 30],
      paddingBottomRight: [40, 50],
      maxZoom: 15, animate: false
    });
  }
}

document.querySelectorAll('.seg button').forEach(btn => btn.addEventListener('click', () => {
  filtro = btn.dataset.f;
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
  render(true);
}));

document.getElementById('q').addEventListener('input', e => { busca = e.target.value.trim(); render(true); });

document.getElementById('list').addEventListener('click', e => {
  const btn = e.target.closest('button[data-i]');
  if (!btn) return;
  const f = feats[+btn.dataset.i];
  const m = markers[f.i];
  if (!m) return;
  map.flyTo([f.lat, f.lon], Math.max(map.getZoom(), 17), { duration: .8 });
  setTimeout(() => m.openPopup(), 850);
});

document.getElementById('toggle').addEventListener('click', e => {
  const p = document.getElementById('panel');
  const c = p.classList.toggle('collapsed');
  document.getElementById('list').style.display = c ? 'none' : '';
  document.querySelector('.search').style.display = c ? 'none' : '';
  e.target.textContent = c ? 'Mostrar filtros' : 'Ocultar filtros';
  e.target.setAttribute('aria-expanded', String(!c));
});

render(true);
</script>
</body>
</html>
